[package]
name = "arom-spider"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
redis = { version = "0.24", features = ["tokio-comp"] }
url = "2.5"
